name: Apple XRDC Preview

on:
  workflow_dispatch:
  push:
    branches: [apple_xrdc]
    paths:
      - ".github/workflows/rdc-preview.yml"

permissions:
  contents: read
  statuses: write

jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 350
    env:
      APPLE_XRDC_PORT: "18443"
      AURORA_MAC_SCREEN_DEVICE: "0:none"

    steps:
      - uses: actions/checkout@v4

      - name: Prepare macOS preview
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          if ! command -v cloudflared >/dev/null 2>&1; then
            brew install cloudflared
          fi
          ffmpeg -hide_banner -f avfoundation -list_devices true -i "" 2>&1 | tee "$RUNNER_TEMP/avfoundation-devices.txt" || true
          grep -q "Capture screen" "$RUNNER_TEMP/avfoundation-devices.txt"

      - name: Build apple_xrdc
        shell: bash
        run: |
          set -euo pipefail
          cargo build

      - name: Start apple_xrdc
        shell: bash
        run: |
          set -euo pipefail
          PASS="AppleXRDC-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PASS_FILE="$RUNNER_TEMP/apple-xrdc-passwd"
          printf '%s\n' "$PASS" > "$PASS_FILE"
          chmod 600 "$PASS_FILE"
          echo "PREVIEW_PASSWORD=$PASS" >> "$GITHUB_ENV"

          VIBE_RDESK_BIND="127.0.0.1:$APPLE_XRDC_PORT" \
          AURORA_MAC_SCREEN_DEVICE="$AURORA_MAC_SCREEN_DEVICE" \
            ./target/debug/vibe_rdesk \
              --passwd-file "$PASS_FILE" \
              --localhost yes \
              --port "$APPLE_XRDC_PORT" \
              >"$RUNNER_TEMP/apple-xrdc.log" 2>&1 &

          APPLE_XRDC_PID=$!
          echo "APPLE_XRDC_PID=$APPLE_XRDC_PID" >> "$GITHUB_ENV"

          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$APPLE_XRDC_PORT/healthz" | grep -q "ok"; then
              echo "apple_xrdc ready on localhost:$APPLE_XRDC_PORT"
              exit 0
            fi
            if ! kill -0 "$APPLE_XRDC_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/apple-xrdc.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/apple-xrdc.log"
          exit 1

      - name: Start public preview tunnel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cloudflared tunnel \
            --no-autoupdate \
            --url "http://127.0.0.1:$APPLE_XRDC_PORT" \
            >"$RUNNER_TEMP/cloudflared.log" 2>&1 &

          CF_PID=$!
          echo "CLOUDFLARED_PID=$CF_PID" >> "$GITHUB_ENV"

          PREVIEW_URL=""
          for _ in $(seq 1 90); do
            PREVIEW_URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -n 1 || true)"
            if [ -n "$PREVIEW_URL" ]; then
              break
            fi
            if ! kill -0 "$CF_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/cloudflared.log"
              exit 1
            fi
            sleep 1
          done

          if [ -z "$PREVIEW_URL" ]; then
            cat "$RUNNER_TEMP/cloudflared.log"
            exit 1
          fi

          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview URL: $PREVIEW_URL"
          echo "Preview password: $PREVIEW_PASSWORD"

          {
            echo "## Apple XRDC macOS preview"
            echo
            echo "Preview URL: $PREVIEW_URL"
            echo
            echo "Password: $PREVIEW_PASSWORD"
            echo
            echo "Runner: $(sw_vers -productVersion) / $(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

          payload="$(jq -n \
            --arg state pending \
            --arg target_url "$PREVIEW_URL" \
            --arg description "Apple XRDC preview ready" \
            --arg context "apple-xrdc/preview" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null

      - name: Keep preview alive
        shell: bash
        run: |
          set -euo pipefail
          echo "Apple XRDC preview is live: $PREVIEW_URL"
          echo "Password: $PREVIEW_PASSWORD"

          while kill -0 "$APPLE_XRDC_PID" 2>/dev/null && kill -0 "$CLOUDFLARED_PID" 2>/dev/null; do
            sleep 30
          done

          echo "apple_xrdc or cloudflared exited."
          echo "--- apple_xrdc log ---"
          tail -n 120 "$RUNNER_TEMP/apple-xrdc.log" || true
          echo "--- cloudflared log ---"
          tail -n 120 "$RUNNER_TEMP/cloudflared.log" || true
          exit 1
