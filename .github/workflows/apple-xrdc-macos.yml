name: apple_xrdc macOS

on:
  push:
    branches: [apple_xrdc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-build-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          sw_vers
          uname -m
          rustc --version
          cargo --version
          ffmpeg -version | head -n 3 || true
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
      - name: Normalize Rust formatting
        run: cargo fmt --all
      - name: Build macOS server
        run: cargo build --all-targets
      - name: Test macOS server
        run: cargo test --all-targets
      - name: Smoke test ScreenCaptureKit + VideoToolbox
        run: |
          helper="$(find target/debug/build -type f -name apple_xrdc_capture -perm -111 | head -n 1)"
          test -n "$helper"
          "$helper" --fps 10 --bitrate-kbps 2500 --gop-ms 1000 --height 720 \
            >"$RUNNER_TEMP/apple-native.h264" 2>"$RUNNER_TEMP/apple-native.log" &
          helper_pid=$!
          sleep 6
          kill "$helper_pid" 2>/dev/null || true
          wait "$helper_pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/apple-native.log"
          test -s "$RUNNER_TEMP/apple-native.h264"
          ffprobe -v error -f h264 \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 "$RUNNER_TEMP/apple-native.h264"

          ffmpeg -hide_banner -loglevel error \
            -f h264 -i "$RUNNER_TEMP/apple-native.h264" \
            -vf "select=eq(n\\,0),signalstats,metadata=print" \
            -frames:v 1 -f null - 2>"$RUNNER_TEMP/native-frame-stats.txt" || true
          cat "$RUNNER_TEMP/native-frame-stats.txt"
          yavg="$(grep -Eo 'lavfi.signalstats.YAVG=[0-9.]+' "$RUNNER_TEMP/native-frame-stats.txt" | head -n1 | cut -d= -f2 || true)"
          test -n "$yavg"
          python3 - "$yavg" <<'PY'
import sys
y = float(sys.argv[1])
print(f"native_frame_yavg={y:.3f}")
if y < 8.0:
    raise SystemExit("native ScreenCaptureKit frame is effectively black")
PY
      - name: Probe AVFoundation devices
        run: |
          ffmpeg -hide_banner -f avfoundation -list_devices true -i "" 2>&1 | tee avfoundation-devices.txt || true
          grep -q "Capture screen" avfoundation-devices.txt
      - name: Smoke test macOS screen capture
        run: |
          ffmpeg -hide_banner -loglevel warning \
            -f avfoundation -capture_cursor 1 -framerate 1 \
            -i "0:none" -frames:v 1 -y "$RUNNER_TEMP/apple-xrdc-screen.png"
          test -s "$RUNNER_TEMP/apple-xrdc-screen.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/apple-xrdc-screen.png"
      - name: Smoke test macOS server runtime
        run: |
          VIBE_RDESK_BIND="127.0.0.1:18443" \
            ./target/debug/vibe_rdesk --passwd mac-ci >"$RUNNER_TEMP/apple-xrdc-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18443/healthz" | grep -q "ok"; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/apple-xrdc-server.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/apple-xrdc-server.log"
          exit 1
      - name: Port status
        if: always()
        run: |
          {
            echo "## apple_xrdc macOS validation"
            echo
            echo "- Runner: macos-latest"
            echo "- Architecture: $(uname -m)"
            echo "- Default capture backend: Apple ScreenCaptureKit"
            echo "- Default encoder: Apple VideoToolbox"
            echo "- Fallback capture backend: FFmpeg AVFoundation"
            echo "- Input backend: CoreGraphics CGEvent"
            echo "- Clipboard: pbcopy/pbpaste"
            echo "- Screen capture smoke test: passed"
            echo "- HTTP server runtime smoke test: passed"
            echo "- System audio / virtual camera: pending native macOS implementation"
          } >> "$GITHUB_STEP_SUMMARY"
